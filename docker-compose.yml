name: billsplit

# Only the gateway is published to the host for clients. Backend services are
# reachable only inside the compose network (they trust x-user-id from the gateway).

x-go-service: &go-service
  image: billsplit-go:latest
  build: { context: . }   # same image for every Go service (cached after the first build)
  restart: unless-stopped
  # Graceful shutdown: SIGTERM → readiness 503 → drain → finish in-flight work.
  # Must exceed SHUTDOWN_TIMEOUT (25s) so Docker doesn't SIGKILL mid-drain.
  stop_grace_period: 35s
  secrets: [jwt_secret, internal_token, redis_password, ocrspace_api_key, anthropic_api_key, expo_access_token]
  environment: &env
    APP_ENV: ${APP_ENV:-local}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:9092
    # Secrets are Docker secrets mounted at /run/secrets/<name> (see `secrets:` at
    # the bottom, generated by `make secrets`); the app reads NAME_FILE paths.
    JWT_SECRET_FILE: /run/secrets/jwt_secret
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    AUTH_ADDR: auth:50051
    SOCIAL_ADDR: social:50051
    SPLIT_ADDR: split:50051
    FINANCE_ADDR: finance:50051
    NOTIFY_ADDR: notify:50051
    # Shared secret for service-to-service gRPC (x-internal-token).
    INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    OCR_URL: http://ocr:8000
    OCRSPACE_API_KEY_FILE: /run/secrets/ocrspace_api_key   # empty file = disabled
    ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key # empty file = disabled
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    EXPO_ACCESS_TOKEN_FILE: /run/secrets/expo_access_token
    WEB_URL: ${WEB_URL:-http://localhost:8081}
  depends_on: &deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  gateway:
    <<: *go-service
    command: ["gateway"]
    ports:
      - "8088:8088"   # public HTTP/JSON API for web & mobile
    depends_on: [auth, social, split, finance, notify]

  auth:
    <<: *go-service
    command: ["auth"]
    secrets: [jwt_secret, internal_token, redis_password, ocrspace_api_key, anthropic_api_key, expo_access_token, auth_db_password]
    environment:
      <<: *env
      POSTGRES_SCHEMA: auth
      # Own role per service (deploy/postgres/init.sql): it can't see other schemas.
      POSTGRES_DSN: postgres://auth_svc@postgres:5432/billsplit?sslmode=disable
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_password
    depends_on: *deps

  social:
    <<: *go-service
    command: ["social"]
    secrets: [jwt_secret, internal_token, redis_password, ocrspace_api_key, anthropic_api_key, expo_access_token, social_db_password]
    environment:
      <<: *env
      POSTGRES_SCHEMA: social
      # Own role per service (deploy/postgres/init.sql): it can't see other schemas.
      POSTGRES_DSN: postgres://social_svc@postgres:5432/billsplit?sslmode=disable
      POSTGRES_PASSWORD_FILE: /run/secrets/social_db_password
    depends_on: *deps

  split:
    <<: *go-service
    command: ["split"]
    secrets: [jwt_secret, internal_token, redis_password, ocrspace_api_key, anthropic_api_key, expo_access_token, split_db_password]
    environment:
      <<: *env
      POSTGRES_SCHEMA: split
      # Own role per service (deploy/postgres/init.sql): it can't see other schemas.
      POSTGRES_DSN: postgres://split_svc@postgres:5432/billsplit?sslmode=disable
      POSTGRES_PASSWORD_FILE: /run/secrets/split_db_password
    depends_on: *deps

  finance:
    <<: *go-service
    command: ["finance"]
    secrets: [jwt_secret, internal_token, redis_password, ocrspace_api_key, anthropic_api_key, expo_access_token, finance_db_password]
    environment:
      <<: *env
      POSTGRES_SCHEMA: finance
      # Own role per service (deploy/postgres/init.sql): it can't see other schemas.
      POSTGRES_DSN: postgres://finance_svc@postgres:5432/billsplit?sslmode=disable
      POSTGRES_PASSWORD_FILE: /run/secrets/finance_db_password
    depends_on: *deps

  notify:
    <<: *go-service
    command: ["notify"]
    secrets: [jwt_secret, internal_token, redis_password, ocrspace_api_key, anthropic_api_key, expo_access_token, notify_db_password]
    environment:
      <<: *env
      POSTGRES_SCHEMA: notify
      POSTGRES_DSN: postgres://notify_svc@postgres:5432/billsplit?sslmode=disable
      POSTGRES_PASSWORD_FILE: /run/secrets/notify_db_password
    depends_on: *deps

  ocr-worker:
    <<: *go-service
    command: ["ocr-worker"]
    depends_on:
      kafka: { condition: service_healthy }
      ocr: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Web client: Expo web export served by nginx (apps/mobile/Dockerfile).
  web:
    build: ./apps/mobile
    restart: unless-stopped
    stop_signal: SIGQUIT # nginx graceful stop (SIGTERM = immediate)
    ports: ["8081:80"]
    depends_on: [gateway]

  # Self-hosted OCR: RapidOCR = PaddleOCR models on ONNX Runtime (free, no limits).
  ocr:
    build: ./services/ocr
    restart: unless-stopped
    stop_grace_period: 30s # let uvicorn finish an in-flight recognition
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    stop_grace_period: 30s # clean checkpoint on shutdown
    environment:
      POSTGRES_USER: billsplit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: billsplit
    secrets: [postgres_password, auth_db_password, social_db_password, split_db_password, finance_db_password, notify_db_password]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates one role + schema per service on the FIRST start of an empty volume,
      # then sets role passwords from secrets. Existing volume: `make db-passwords`.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./deploy/postgres/20-role-passwords.sh:/docker-entrypoint-initdb.d/20-role-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billsplit"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    secrets: [redis_password]
    # Password comes from the secret file, never from the command line in compose.
    command: ["sh", "-c", 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory 256mb --maxmemory-policy allkeys-lru']
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  kafka:
    image: apache/kafka:4.1.0
    stop_grace_period: 30s # controlled broker shutdown
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8085:8080"]
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    secrets: [grafana_admin_password]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:

# Docker secrets: files in ./secrets (git-ignored), created by `make secrets`.
# Mounted read-only at /run/secrets/<name>; never visible in `docker inspect` env.
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  internal_token:
    file: ./secrets/internal_token
  postgres_password:
    file: ./secrets/postgres_password
  auth_db_password:
    file: ./secrets/auth_db_password
  social_db_password:
    file: ./secrets/social_db_password
  split_db_password:
    file: ./secrets/split_db_password
  finance_db_password:
    file: ./secrets/finance_db_password
  notify_db_password:
    file: ./secrets/notify_db_password
  redis_password:
    file: ./secrets/redis_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  ocrspace_api_key:
    file: ./secrets/ocrspace_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  expo_access_token:
    file: ./secrets/expo_access_token
