server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Universal Links (iOS) — must be served as JSON, without a file extension and without redirects.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files /.well-known/apple-app-site-association =404;
  }

  # App Links (Android).
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files /.well-known/assetlinks.json =404;
  }

  # Hashed bundles can be cached forever.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /invite/<token>, /group/<id>, ... are client-side routes.
  location / {
    try_files $uri $uri.html /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
